<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tech shop</title>
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <div class="header">
      <div class="goHome">
        <h2><a href="index.html">TECH-SHOP</a></h2>
      </div>

      <div class="mini-profile">
        <img src="/avatar.jpeg" alt="" />
        <button popovertarget="my-popover">Сменить тему</button>
        <div id="my-popover" popover>
          <p>
            Здесь пока нет функционала для смены темы,но он обязательно появится
            позже!
          </p>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="item" id="productTemplate" style="display: none">
        <img class="product-image" src="" alt="Товар" />
        <h3 class="product-title"></h3>
        <p class="product-price"></p>
        <button class="buy-btn">Купить</button>
      </div>
    </div>

    <script src="../script/index.js"></script>
  </body>
</html>
